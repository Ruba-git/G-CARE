<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - G care</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <div class="logo">G <span>care</span></div>
                <h1>Join G care</h1>
                <p>Create your account to get started</p>
            </div>

            <div class="auth-form-container">
                <!-- Social Login Buttons -->
                <div class="social-login">
                    <button class="btn-google" onclick="handleGoogleSignIn()">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Sign up with Google
                    </button>
                    <div class="divider">
                        <span>or</span>
                    </div>
                </div>

                <!-- Email Sign Up Form -->
                <form id="signUpForm" class="auth-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter your phone number" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                    </div>
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" required>
                            I agree to the <a href="#" target="_blank">Terms of Service</a> and <a href="#" target="_blank">Privacy Policy</a>
                        </label>
                    </div>
                    <button type="button" id="sendOtpBtn" class="btn-primary">Send OTP</button>
                    <div id="otpSection" style="display: none;">
                        <div class="form-group">
                            <label for="otp">Enter OTP</label>
                            <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
                        </div>
                        <button type="submit" class="btn-primary">Verify & Create Account</button>
                    </div>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Sign in</a></p>
                </div>
            </div>
        </div>

        <!-- Voice Control Button -->
        <button class="voice-control-btn" onclick="toggleVoiceControl()" id="voiceBtn">
            <span id="voiceIcon">🎤</span>
            <span id="voiceText">Voice Control</span>
        </button>
    </div>

    <script>
        // Google Sign-In initialization
        function initGoogleSignIn() {
            google.accounts.id.initialize({
                client_id: 'YOUR_GOOGLE_CLIENT_ID', // Replace with your actual client ID
                callback: handleGoogleCallback
            });
            google.accounts.id.renderButton(
                document.querySelector('.btn-google'),
                { theme: 'outline', size: 'large' }
            );
        }

        function handleGoogleSignIn() {
            // For demo purposes, simulate Google sign-in
            showNotification("🔄 Connecting to Google...", "info");
            setTimeout(() => {
                // Simulate successful signup
                const user = {
                    name: "John Doe",
                    email: "john.doe@gmail.com",
                    phone: "",
                    address: ""
                };
                localStorage.setItem('smartCareUser', JSON.stringify(user));
                showNotification("✅ Account created with Google successfully!", "success");
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }, 2000);
        }

        function handleGoogleCallback(response) {
            // Handle actual Google OAuth response
            console.log('Google Sign-In response:', response);
            // Process the JWT token and create user account
        }

        // Email Sign Up - Send OTP
        document.getElementById('sendOtpBtn').addEventListener('click', async function() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;

            // Validation
            if (!name || !email || !phone || !password) {
                showNotification("❌ All fields are required.", "error");
                return;
            }

            if (password !== confirmPassword) {
                showNotification("❌ Passwords do not match.", "error");
                return;
            }

            if (password.length < 6) {
                showNotification("❌ Password must be at least 6 characters long.", "error");
                return;
            }

            if (!terms) {
                showNotification("❌ Please accept the Terms of Service.", "error");
                return;
            }

            const generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
            window.generatedSignupOtp = generatedOtp;
            console.log('Demo OTP:', generatedOtp);

            showNotification("✅ OTP sent to your phone number. Check console for demo OTP.", "success");
            document.getElementById('sendOtpBtn').style.display = 'none';
            document.getElementById('otpSection').style.display = 'block';
        });

        // Email Sign Up - Verify OTP and Create Account
        document.getElementById('signUpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const otp = document.getElementById('otp').value;

            if (!otp || otp.length !== 6 || otp !== window.generatedSignupOtp) {
                showNotification("❌ Please enter the valid 6-digit OTP shown in console.", "error");
                return;
            }

            if (!window.supabaseClient) {
                showNotification('❌ Supabase is not initialized. Please reload the page.', 'error');
                return;
            }

            try {
                const { data, error } = await window.supabaseClient.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            name,
                            phone
                        }
                    }
                });
                if (error) throw error;

                const user = {
                    id: data?.user?.id || null,
                    email: data?.user?.email || email,
                    name: data?.user?.user_metadata?.name || name,
                    phone: data?.user?.user_metadata?.phone || phone
                };

                localStorage.setItem('smartCareUser', JSON.stringify(user));
                showNotification("✅ Account created successfully! Welcome to G care.", "success");
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } catch (error) {
                showNotification(`❌ ${error.message}`, "error");
            }
        });

        // Voice Control
        let recognition = null;
        let isListening = false;

        function toggleVoiceControl() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                showNotification("❌ Voice control not supported in this browser.", "error");
                return;
            }

            if (isListening) {
                stopVoiceControl();
            } else {
                startVoiceControl();
            }
        }

        function startVoiceControl() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = function() {
                isListening = true;
                document.getElementById('voiceBtn').classList.add('listening');
                document.getElementById('voiceIcon').textContent = '🎙️';
                document.getElementById('voiceText').textContent = 'Listening...';
                showNotification("🎤 Voice control activated. Try saying 'sign up with Google' or 'fill name'", "info");
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript.toLowerCase();
                processVoiceCommand(transcript);
            };

            recognition.onend = function() {
                stopVoiceControl();
            };

            recognition.onerror = function(event) {
                showNotification("❌ Voice recognition error: " + event.error, "error");
                stopVoiceControl();
            };

            recognition.start();
        }

        function stopVoiceControl() {
            if (recognition) {
                recognition.stop();
            }
            isListening = false;
            document.getElementById('voiceBtn').classList.remove('listening');
            document.getElementById('voiceIcon').textContent = '🎤';
            document.getElementById('voiceText').textContent = 'Voice Control';
        }

        function processVoiceCommand(command) {
            if (command.includes('sign up with google') || command.includes('google sign up')) {
                handleGoogleSignIn();
            } else if (command.includes('fill name') || command.includes('enter name')) {
                document.getElementById('name').focus();
                showNotification("📝 Name field focused. Please speak your full name.", "info");
            } else if (command.includes('fill email') || command.includes('enter email')) {
                document.getElementById('email').focus();
                showNotification("📧 Email field focused. Please speak your email address.", "info");
            } else if (command.includes('fill phone') || command.includes('enter phone')) {
                document.getElementById('phone').focus();
                showNotification("📞 Phone field focused. Please speak your phone number.", "info");
            } else if (command.includes('go to sign in') || command.includes('sign in')) {
                window.location.href = 'login.html';
            } else {
                showNotification("❓ Command not recognized. Try 'sign up with Google' or 'fill name'", "warning");
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is already logged in
            const user = JSON.parse(localStorage.getItem('smartCareUser') || 'null');
            if (user) {
                window.location.href = 'index.html';
            }

            // Initialize Google Sign-In (commented out for demo)
            // initGoogleSignIn();
        });
    </script>
</body>
</html>
